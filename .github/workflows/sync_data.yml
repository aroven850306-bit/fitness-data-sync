
name: Sync Garmin and Strava Data

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      wellness_days:
        description: "가민 웰니스 조회 일수 (기본 30일)"
        required: false
        default: "30"
      activity_limit:
        description: "가민 활동 최대 조회 건수 (기본 100건)"
        required: false
        default: "100"

permissions:
  contents: write

jobs:
  sync-fitness-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. 저장소 체크아웃
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v4

      # 1-1. HTML 리포트 내 잘못된 마크다운 펜스 라인 자동 정리
      - name: 1-1. HTML 리포트 파일 정리
        run: |
          if [ -f cycling_daily_report_11_23.html ]; then
            python - <<'PY'
          from pathlib import Path

          p = Path("cycling_daily_report_11_23.html")
          lines = p.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines(keepends=True)

          cleaned = [
              ln for ln in lines
              if ln.strip() not in ("html", "`html")
          ]

          if len(cleaned) != len(lines):
              p.write_text("".join(cleaned), encoding="utf-8")
              print("[OK] Removed stray markdown fence lines")
          PY
          fi

      # 2. Python 3.11 환경 설정
      - name: 2. Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. 의존성 패키지 설치
      - name: 3. 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Garmin 및 Strava 데이터 수집
      - name: 4. Garmin 및 Strava 데이터 수집
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          FTP_WATTS: ${{ vars.FTP_WATTS || '194' }}
          LTHR_BPM: ${{ vars.LTHR_BPM || '147' }}
          MAX_HR: ${{ vars.MAX_HR || '173' }}
          WELLNESS_DAYS: ${{ github.event.inputs.wellness_days || '30' }}
          ACTIVITY_LIMIT: ${{ github.event.inputs.activity_limit || '100' }}
          TZ: Asia/Seoul
        run: |
          python fetch_fitness_data.py

      # 5. FIT 파일 1초 정밀 분석 및 블록 요약 생성
      - name: 5. FIT 파일 1초 정밀 분석 및 블록 요약 생성
        env:
          FTP_WATTS: ${{ vars.FTP_WATTS || '194' }}
          LTHR_BPM: ${{ vars.LTHR_BPM || '147' }}
          MAX_HR: ${{ vars.MAX_HR || '173' }}
          TZ: Asia/Seoul
        run: |
          if [ -f analyze_fit.py ]; then
            python analyze_fit.py
          fi

          if [ -f build_latest_1s_summary.py ]; then
            python build_latest_1s_summary.py
          fi

      # 6. 통합 코칭 분석 엔진 실행
      - name: 6. 통합 코칭 분석 엔진 실행
        env:
          FTP_WATTS: ${{ vars.FTP_WATTS || '194' }}
          LTHR_BPM: ${{ vars.LTHR_BPM || '147' }}
          MAX_HR: ${{ vars.MAX_HR || '173' }}
          TZ: Asia/Seoul
        run: |
          if [ -f build_unified_coaching_engine.py ]; then
            python build_unified_coaching_engine.py
          fi

      # 7. Google Drive 스프레드시트 및 상태 파일 동기화
      - name: 7. Google Drive 동기화
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TZ: Asia/Seoul
        run: |
          if [ -z "$GDRIVE_CREDENTIALS" ] || [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "[WARN] Google Drive 인증 정보가 없어 동기화를 건너뜁니다."
            exit 0
          fi

          if [ -f upload_to_gdrive.py ]; then
            python upload_to_gdrive.py
          else
            echo "[WARN] upload_to_gdrive.py 파일이 없어 동기화를 건너뜁니다."
          fi

      # 8. 변경된 CSV/JSON/요약 산출물 저장소 커밋
      - name: 8. 변경된 파일 커밋 및 푸시
        env:
          TZ: Asia/Seoul
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "[INFO] 커밋할 변경 사항이 없습니다."
          else
            git commit -m "chore: sync fitness data & coaching state ($(date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi
