name: Sync Garmin, Strava & Unified Coaching Engine

on:
schedule:
# 기상 직후 집중 동기화 (KST 06:30 ~ 09:30 매 30분 / UTC 21:30 ~ 00:30)
- cron: "0,30 21,22,23,0 * * *"
# 주간·야간 훈련 후 동기화 (KST 10:00 ~ 23:00 매 1시간 / UTC 01:00 ~ 14:00)
- cron: "0 1-14 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
sync-and-analyze:
runs-on: ubuntu-latest

steps:
  - name: 1. 저장소 체크아웃
    uses: actions/checkout@v4

  - name: 2. Python 3.11 환경 설정
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"
      cache: "pip"

  - name: 3. 필수 라이브러리 설치
    run: |
      python -m pip install --upgrade pip
      if [ -f requirements.txt ]; then
        pip install -r requirements.txt
      fi
      pip install garminconnect fitparse pandas numpy requests python-dotenv google-api-python-client google-auth

  - name: 4. Garmin 및 Strava 원천 데이터 수집
    env:
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
      GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      FTP_WATTS: ${{ vars.FTP_WATTS || '194' }}
      LTHR_BPM: ${{ vars.LTHR_BPM || '147' }}
      MAX_HR: ${{ vars.MAX_HR || '173' }}
    run: |
      python fetch_fitness_data.py

  - name: 5. FIT 1초 정밀 분석 및 직전 세션 요약 생성
    env:
      FTP_WATTS: ${{ vars.FTP_WATTS || '194' }}
      LTHR_BPM: ${{ vars.LTHR_BPM || '147' }}
      MAX_HR: ${{ vars.MAX_HR || '173' }}
    run: |
      if [ -f analyze_fit.py ]; then python analyze_fit.py; fi
      if [ -f build_latest_1s_summary.py ]; then python build_latest_1s_summary.py; fi
      if [ -f build_readiness_v2.py ]; then python build_readiness_v2.py; fi

  - name: 6. 통합 분석 엔진 실행 (일·주·월·대회 전 4계층 판단)
    env:
      FTP_WATTS: ${{ vars.FTP_WATTS || '194' }}
      LTHR_BPM: ${{ vars.LTHR_BPM || '147' }}
      MAX_HR: ${{ vars.MAX_HR || '173' }}
    run: |
      python build_unified_coaching_engine.py

  - name: 7. Google Drive 스프레드시트 및 상태 JSON 동기화
    env:
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    run: |
      python upload_to_gdrive.py

  - name: 8. 변경된 CSV/JSON/요약 산출물 저장소 커밋
    run: |
      git config --local user.email "github-actions[bot]@users.noreply.github.com"
      git config --local user.name "github-actions[bot]"
      git add -A
      if git diff --staged --quiet; then
        echo "변경된 데이터 파일이 없어 커밋을 건너뜁니다."
      else
        git commit -m "chore(data): auto-sync fitness data & unified coaching state [skip ci]"
        git push
      fi
