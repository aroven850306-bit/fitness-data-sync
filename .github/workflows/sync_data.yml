name: Sync Garmin and Strava Data

on:
schedule:
# 1) KST 06:00 (21:00 UTC) - 아침 첫 동기화
- cron: '0 21 * * *'
# 2) KST 07:00 ~ 08:50 (22:00 ~ 23:50 UTC) - 기상 후 수면/HRV 집중 수집 (10분 간격)
- cron: '0,10,20,30,40,50 22,23 * * *'
# 3) KST 09:00 (00:00 UTC) - 오전 9시 정각 집중 수집 마무리
- cron: '0 0 * * *'
# 4) KST 10:00 ~ 23:00 (01:00 ~ 14:00 UTC) - 주간 및 저녁 운동 시간대 (1시간 간격)
- cron: '0 1-14 * * *'
# 5) KST 23:30 (14:30 UTC) - 늦은 저녁 실내 훈련 데이터 최종 수집
- cron: '30 14 * * *'
workflow_dispatch:

permissions:
contents: write

jobs:
fetch-and-commit:
runs-on: ubuntu-latest

steps:
  - name: 1. 저장소 코드 체크아웃
    uses: actions/checkout@v5

  - name: 2. Python 환경 설정
    uses: actions/setup-python@v6
    with:
      python-version: '3.11'

  - name: 3. 필수 라이브러리 설치 (FIT 분석 및 Google Drive API 포함)
    run: |
      pip install requests pandas fitparse numpy google-api-python-client google-auth garminconnect python-dotenv

  - name: 4. 데이터 수집, FIT 정밀 분석, 1초 요약 및 Google Drive 업로드 실행
    env:
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
      GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      FTP_WATTS: ${{ vars.FTP_WATTS || '194' }}
      MAX_HR: ${{ vars.MAX_HR || '173' }}
      WELLNESS_DAYS: ${{ github.event_name == 'schedule' && '3' || '30' }}
      ACTIVITY_LIMIT: ${{ github.event_name == 'schedule' && '15' || '100' }}
    run: |
      python fetch_fitness_data.py
      python analyze_fit.py
      python build_latest_1s_summary.py
      python upload_to_gdrive.py

  - name: 5. 업데이트된 CSV, 요약 TXT 및 FIT 파일 자동 커밋 및 푸시
    run: |
      git config --local user.email "github-actions[bot]@users.noreply.github.com"
      git config --local user.name "github-actions[bot]"
      mkdir -p fit_files
      git add *.csv *.txt fit_files/
      git diff --quiet && git diff --staged --quiet || (git commit -m "Update fitness data, 1s summary & GDrive sync: $(date +'%Y-%m-%d %H:%M')" && git push)
