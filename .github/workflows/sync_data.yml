name: Sync Garmin and Strava Data

on:
  schedule:
    # 매일 UTC 14:00 (한국 시간 밤 11:00) 자동 실행
    - cron: '0 14 * * *'
  # GitHub Actions 탭에서 수동 버튼 클릭으로 즉시 실행 허용
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v5

      - name: 2. Python 환경 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 설치 (FIT 분석 및 Google Drive API 포함)
        run: |
          pip install requests pandas fitparse numpy google-api-python-client google-auth

      - name: 4. 데이터 수집, FIT 정밀 분석 및 Google Drive 업로드 실행
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python fetch_fitness_data.py
          python analyze_fit.py
          python upload_to_gdrive.py

      - name: 5. 업데이트된 CSV 및 FIT 파일 자동 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p fit_files
          git add *.csv fit_files/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update fitness data, FIT analysis & GDrive sync: $(date +'%Y-%m-%d %H:%M')" && git push)
