name: Sync Garmin and Strava Data

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 라이브러리 설치
        run: |
          pip install requests pandas

      - name: 4. 가민 및 스트라바 데이터 수집 실행
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: |
          python fetch_fitness_data.py

      - name: 5. 업데이트된 CSV 및 FIT 파일 자동 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p fit_files
          git add *.csv fit_files/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update fitness data & FIT files: $(date +'%Y-%m-%d %H:%M')" && git push)
